name: Deploy to Hugging Face Space

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare deployment directory
        run: |
          mkdir build

          # Files
          cp -r deployment/. build/

      - name: Deploy build to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          echo "Token length: ${#HF_TOKEN}"
          cd build
          git init -b main
          git config --global user.email "github-actions@github.com"
          git config --global user.name "github-actions"
          git remote add hf https://USER:${HF_TOKEN}@huggingface.co/spaces/dhruvbansalup/dl-genai-project-26-t2-smart-mcq-solver
          git add .
          git commit -m "Deploy from GitHub Actions" || echo "No changes to commit"
          git push hf main --force